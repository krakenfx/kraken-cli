[package]
description            = "Typed wire model and error taxonomy for the Kraken Spot WebSocket v2 protocol"
edition.workspace      = true
license.workspace      = true
name                   = "kraken-core"
publish                = false
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[features]
# Derive `clap::ValueEnum` on the CLI-facing enums (SubscribableChannel, EventTrigger)
# so a binary can accept them as arguments; off by default to keep layer 0 CLI-free.
clap = ["dep:clap"]

# Derive `JsonSchema` on the wire enums the command tree exposes, so a tool
# schema is generated from the same type the parser validates against.
schema = ["dep:schemars"]

# Layer 0: pure data — parsing, validation, serialization. No I/O, no tokio, no
# transport crates; that boundary is the point of the crate.
[dependencies]
clap         = { workspace = true, optional = true }
rust_decimal = { workspace = true }
schemars     = { workspace = true, optional = true }
serde        = { workspace = true }
# `arbitrary_precision` must stay off, here and anywhere in the workspace tree:
# `ChannelMessage`'s flattened envelope buffers payloads through serde's `Content`
# type, which cannot carry that feature's number representation — every WS frame
# would fail to decode. The captured-payload round-trip tests are the tripwire.
serde_json = { workspace = true }
serde_with = { workspace = true }
strum      = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
