# A virtual manifest: every crate here is a front-end (kraken-cli,
# kraken-shell, kraken-mcp) or a library they share. The kraken-cli package
# builds all three binaries. Nothing is built at the workspace root.
[workspace]
members = ["crates/*"]
# Explicit because a virtual manifest has no edition to imply it; every member
# is edition 2024, which implies resolver 3.
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.5.0"
# Deliberate floor: bumped manually to current stable. Gated by `just msrv`,
# which reads the version from here alone.
license      = "MIT"
repository   = "https://github.com/krakenfx/kraken-cli"
rust-version = "1.97"

[workspace.dependencies]
base64       = "0.23.1"
chrono       = { version = "0.4.45", features = ["serde"] }
clap         = { version = "4.6.7", features = ["derive"] }
dirs         = "7.0.0"
duckdb       = { version = "1.10506.1", features = ["bundled"] }
futures-util = "0.3.34"
# OS randomness for PKCE verifiers and OAuth state; already in the lockfile via
# uuid and tempfile.
getrandom        = "0.4.3"
humantime        = "2.4.0"
insta            = { version = "1.49.0", features = ["json"] }
kraken-app       = { path = "crates/kraken-app" }
kraken-auth      = { path = "crates/kraken-auth" }
kraken-cli       = { path = "crates/kraken-cli" }
kraken-contract  = { path = "crates/kraken-contract" }
kraken-core      = { path = "crates/kraken-core" }
kraken-lab       = { path = "crates/kraken-lab" }
kraken-mcp       = { path = "crates/kraken-mcp" }
kraken-paper     = { path = "crates/kraken-paper" }
kraken-recipe    = { path = "crates/kraken-recipe" }
kraken-recording = { path = "crates/kraken-recording" }
kraken-replay    = { path = "crates/kraken-replay" }
kraken-rest      = { path = "crates/kraken-rest" }
kraken-session   = { path = "crates/kraken-session" }
kraken-shell     = { path = "crates/kraken-shell" }
kraken-workspace = { path = "crates/kraken-workspace" }
kraken-ws        = { path = "crates/kraken-ws" }
proptest         = "1.12.0"
reqwest          = { version = "0.13.5", default-features = false, features = ["rustls"] }
# `elicitation` is what lets the dangerous-tool gate reach the operator rather
# than trust an argument the model sets for itself.
rmcp                = { version = "3.6.0", default-features = false, features = ["elicitation", "server", "transport-io"] }
rust_decimal        = { version = "1.43.0", features = ["serde-float", "serde-with-str"] }
rust_decimal_macros = "1.40.0"
# Tool schemas are generated from the command tree's own types (kraken-contract),
# so a flag rename can never silently reshape the MCP surface. `rust_decimal1`
# gives `Decimal` a schema that accepts the string form the API uses.
schemars = { version = "1.2.3", features = ["chrono04", "rust_decimal1"] }
secrecy  = "0.10.3"
serde    = { version = "1.0.229", features = ["derive"] }
# preserve_order: keyed history relays (ledgers, trades-history, orders)
# carry the server's newest-first sequence only in entry order — same-time
# entries cannot be re-sorted. Freeze hashes and tape digests
# hash typed structs or file bytes, so they are unaffected.
serde_json          = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde_path_to_error = "0.1.20"
serde_with          = { version = "3.24.0", default-features = false, features = ["macros"] }
# Experiment freeze hashes (kraken-lab) and the binary's own digests.
sha2              = "0.11.1"
strum             = { version = "0.28", features = ["derive"] }
tempfile          = "3.27.0"
thiserror         = "2.0.21"
tokio             = "1.53.3"
tokio-stream      = "0.1.19"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util        = "0.7.20"
toml              = "1.1.8"
tracing           = "0.1.44"
url               = "2.5.8"
wiremock          = "0.6.5"

# No missing_debug_implementations: `Cli` holds the OTP and API secrets as
# plain Strings, so a derived Debug would print a live credential.

[workspace.lints.rust]
unreachable_pub = "warn"
# Two per-site carve-outs, each with a SAFETY comment: libc::kill supervision
# and Rust 2024 env mutation in telemetry tests.
unsafe_code = "deny"

# The docs gate documents private items, so pub-doc links to pub(crate)
# items resolve; a broken link is a real error.

[workspace.lints.rustdoc]
broken_intra_doc_links  = "deny"
private_intra_doc_links = "allow"

# The panic tripwire the conventions demand: unwrap/panic/todo in non-test code
# fail the clippy gate. clippy.toml carves tests out of the first three; a
# production expect() needs a local #[expect] whose reason states the invariant.

[workspace.lints.clippy]
dbg_macro     = "deny"
expect_used   = "deny"
panic         = "deny"
todo          = "deny"
unimplemented = "deny"
unwrap_used   = "deny"

# Dependencies are never stepped through, and `target/` is the input to every CI
# cache upload.
# Dropping their DWARF takes libduckdb.a from 1.5 GB to 249 MB and target/ from
# 10 GB to 5 GB, for -17% on a cold `--tests` build. Test wall-clock is
# unaffected. `line-tables-only` keeps the file:line a failing assert needs.
[profile.dev]
debug = "line-tables-only"

# debug = 0 also clears DEBUG for build scripts — that, not the rustc flag, is
# what stops `cc` passing `-g` to the bundled DuckDB amalgamation.
[profile.dev.package."*"]
debug = 0
strip = "debuginfo"

# The profile cargo-dist builds releases with. Cargo reads profiles only from
# the workspace root, so this was dropped rather than moved when kraken-cli
# stopped being the root package; without it `dist build` hard-errors.
[profile.dist]
codegen-units = 1
inherits      = "release"
lto           = "thin"
strip         = "symbols"
